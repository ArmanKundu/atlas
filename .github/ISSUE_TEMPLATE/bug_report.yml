name: Bug report
description: Something in Atlas is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste or attach study content, exam papers, textbook pages or anything personal. Describe the file instead ("a 40-page scanned PDF").
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Atlas version
      description: Settings → About
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple silicon), macOS (Intel), Windows, Linux]
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: AI provider in use (if relevant)
      options: [None, Claude, ChatGPT, Gemini, Local model, API key]
