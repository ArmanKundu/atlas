name: Release

# Builds installers for every version tag and attaches them to a draft GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  draft:
    name: Create the draft release
    needs: check
    runs-on: ubuntu-latest
    steps:
      # One draft is created up front, so the Mac and Windows jobs both upload to the same
      # release instead of racing to create their own.
      - name: Create the draft with generated notes
        run: gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --draft --title "Atlas ${TAG#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 + x64
            os: macos-latest
            args: --mac --arm64 --x64
          - name: Windows x64
            os: windows-latest
            args: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build and upload installers
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
